# Render Blueprint — deploy from GitHub after push
# Dashboard: New > Blueprint > connect repo

services:
  - type: web
    name: faceroom-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  # The Celery worker runs as a Docker-based web service on Render's free tier.
  # Render assigns $PORT but Celery ignores it — this is intentional.
  - type: web
    name: faceroom-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile.worker
    # Override CMD so the container acts as a worker, not an HTTP server.
    # The $PORT env var is set by Render but unused by Celery.
    startCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1
    envVars:
      - key: DATABASE_URL
        fromService:
          name: faceroom-api
          type: web
          envVarKey: DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          name: faceroom-api
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_KEY
        fromService:
          name: faceroom-api
          type: web
          envVarKey: SUPABASE_KEY
      - key: QDRANT_URL
        fromService:
          name: faceroom-api
          type: web
          envVarKey: QDRANT_URL
      - key: QDRANT_API_KEY
        fromService:
          name: faceroom-api
          type: web
          envVarKey: QDRANT_API_KEY
      - key: REDIS_URL
        fromService:
          name: faceroom-api
          type: web
          envVarKey: REDIS_URL
      - key: JWT_SECRET
        fromService:
          name: faceroom-api
          type: web
          envVarKey: JWT_SECRET
